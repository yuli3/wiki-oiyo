name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  schedule:
    # 매주 월요일 01:00 UTC = 10:00 KST
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse audit (representative pages)
    runs-on: ubuntu-latest
    # Builds the whole site first; cancelled at the 15-minute mark on 08-03 and
    # 08-10. Same budget as ci.yml.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify current pages and migration contracts
        run: |
          npm run test:current-routes
          npm run verify:current-routes

      # Production migration checks are distinct from this PR's local artifact.
      - name: Verify production migration destinations
        if: github.event_name != 'pull_request'
        run: npm run verify:current-routes:live

      - name: Run Lighthouse CI
        # performance/seo are "error" assertions (fail the check); accessibility/
        # best-practices stay "warn" (see lighthouserc.json). No `|| true` — a
        # threshold miss now fails this workflow, not just the deploy pipeline.
        run: npx --yes @lhci/cli@0.13 autorun

      - name: CrUX (Chrome UX Report) — real-user field data
        # Skips gracefully if CRUX_API_KEY secret is not configured.
        run: node scripts/crux-report.mjs
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}

      - name: Summary
        if: always()
        run: echo "Lighthouse run complete. Report links are in the 'Run Lighthouse CI' step log (temporary-public-storage)." >> "$GITHUB_STEP_SUMMARY"
