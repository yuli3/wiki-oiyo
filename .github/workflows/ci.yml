name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read

# Pushes land in bursts here, and every superseded run used to build the whole
# site to completion. Cloudflare Pages deploys from its own git integration, so
# cancelling a run never cancels a deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    # 9,563 페이지라 정상 런이 이미 10분 안팎(2026-08-05 실측 10분 16초). 20분은 여유가
    # 2배가 안 된다 — 같은 날 blog(9,391페이지)가 느린 러너에서 20분 20초에 잘렸다.
    # 아직 안 걸렸을 뿐 조건은 같으므로 함께 올린다.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify generated category registry
        run: npm run check:category-registry

      - name: Validate i18n keys
        run: npm run validate:i18n

      - name: Verify harness
        run: npm run verify:harness

      - name: Validate structured data
        run: npm run validate:personality

      - name: Audit translations (locale vs body language)
        # Ratchet against scripts/untranslated-baseline.json — fails on a NEW
        # page that declares a locale but serves Korean, not on the known backlog.
        run: npm run audit:translations

      - name: Audit page structure
        run: npm run audit:page-structure


      - name: Type check
        run: npm run type-check

      - name: Build production artifact
        run: npm run build

      # sitemap-submit only reads dist/sitemap*.xml. Handing those over costs a
      # few hundred KB and saves that job a second full site build.
      - name: Upload sitemap XML for the submit job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-xml
          path: dist/sitemap*.xml
          retention-days: 1

  sitemap-submit:
    name: Submit Sitemap (GSC + Bing + IndexNow)
    runs-on: ubuntu-latest
    # The exact-commit Cloudflare Pages gate may legitimately wait up to one
    # hour; this job must outlive that gate plus the local build.
    # The Cloudflare gate can legitimately take an hour; this job must outlive
    # it. Free on public repos, so waiting costs nothing.
    timeout-minutes: 80
    needs: validate
    # Only run on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # IndexNow URL collection reads the sitemap XML from disk rather than
      # HTTP-fetching the live site, which Cloudflare 403s from CI. Validate
      # already built these, so take them instead of building again.
      - name: Download sitemap XML from validate
        uses: actions/download-artifact@v4
        with:
          name: sitemap-xml
          path: dist

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv google-api-python-client google-auth

      - name: Wait for Cloudflare Pages deployment
        # Submission must follow the deployment for this exact commit. Five
        # minutes was tried on 2026-08-12 to cut the Actions bill, and it timed
        # out on four of five repos — every run burned the full five minutes and
        # then submitted before the deploy was live, which is the worst of both.
        # These repos are public now, so the minutes are free and precision is
        # back. The duplicate build stays gone; that was waste either way.
        run: python scripts/wait-cloudflare-check.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_CHECK_TIMEOUT: "3600"

      - name: Submit sitemap to all engines
        run: python scripts/sitemap-submit.py
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          # wiki.oiyo.net is registered in Search Console as a domain property,
          # not a URL-prefix property — must match exactly or GSC returns 403.
          GSC_SITE_URL: sc-domain:wiki.oiyo.net

  manifest-check:
    name: Data Manifest Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate manifest.json
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('public/data/manifest.json', 'utf-8'));
            const meta = manifest._meta;
            if (!meta || !meta.version || !meta.updated) {
              console.error('manifest.json missing _meta fields');
              process.exit(1);
            }
            const namespaces = Object.keys(manifest.namespaces || {});
            console.log('✓ manifest.json valid —', namespaces.length, 'namespaces, version', meta.version, 'updated', meta.updated);
          "

      - name: Check data files exist
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('public/data/manifest.json', 'utf-8'));
            let missing = 0;
            for (const [ns, entry] of Object.entries(manifest.namespaces || {})) {
              for (const file of (entry.files || [])) {
                const path = \`public/data/\${ns}/\${file}\`;
                if (!fs.existsSync(path)) {
                  console.error('MISSING:', path);
                  missing++;
                }
              }
            }
            if (missing > 0) {
              console.error(\`\${missing} data file(s) missing — update manifest.json\`);
              process.exit(1);
            }
            console.log('✓ All manifest-referenced data files exist');
          "
